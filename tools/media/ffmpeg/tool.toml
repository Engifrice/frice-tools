# FFmpeg: prebuilt GPL builds, repackaged. The editor runs ffmpeg and ffprobe
# as separate programs to convert assets.
#
# Windows and Linux: BtbN's "gpl-shared" builds from the n9.0 release branch
# (autobuild-2026-10-31-12-59; BtbN keeps each month's last build for two
# years). They report version n9.0.2-39-g7adfbe40dc: the 9.0.2 release plus 39
# fixes from the branch. The shared variant puts the codec libraries in
# separate files used by both programs, instead of a copy inside each (about
# half the size of the static variant). ffplay, headers, import libraries,
# presets, man pages and documentation are left out.
#
# Windows arm64 needs a build from 2026-10-03 or later: BtbN's Windows arm64
# builds from about 2026-09-24 crashed at startup (llvm-strip removed needed
# sections; BtbN issue #675, fixed by commit 9acad4a9). Do not go back to an
# older build.
#
# macOS: Martin Riedl's static, signed GPL builds of exactly 9.0.2, one zip per
# program. Each program is picked wherever it sits in its zip (at the root
# or below one folder).
#
# Linux loads its libraries through their sonames (libavcodec.so.63 and so
# on), which the archives store as symbolic links; picking them by name ships
# each one as a regular file with the library's content. ffmpeg finds them
# through RPATH $ORIGIN/../lib.
#
# Every platform: x264, x265, SVT-AV1, dav1d and Opus. Windows and Linux also:
# CUDA and NVENC/NVDEC, Vulkan, libplacebo, OpenCL and AMF. macOS: libvpx,
# libaom and VideoToolbox (which FFmpeg enables on its own on macOS; a smoke
# test checks it).
#
# GPL: LICENSES/SOURCE.md ships next to the binaries and says where their
# corresponding source is (the builders' scripts at the exact commits, which
# pin every library, and FFmpeg itself). Update it with every FFmpeg update,
# and whenever one of its links stops working.

schema           = 1
name             = "ffmpeg"
description      = "Converts and inspects audio, video and image files (ffmpeg and ffprobe)."
homepage         = "https://ffmpeg.org/"
version          = "9.0.2"
upstream_version = "n9.0.2"
license          = ["GPL-3.0-or-later"]
platforms        = ["windows-x86_64", "windows-arm64", "linux-x86_64", "linux-arm64", "macos-arm64"]

# Hashes for BtbN builds match the SHA-256 digests on the release page.
[source.windows-x86_64]
url              = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-n9.0.2-39-g7adfbe40dc-win64-gpl-shared-9.0.zip"
sha256           = "1d9823c35c7a7e2f54d1438cf61030d6efabe3278de01c191309d1e828bb74df"
strip_components = 1

[source.windows-arm64]
url              = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-n9.0.2-39-g7adfbe40dc-winarm64-gpl-shared-9.0.zip"
sha256           = "f6b7927191e11fe20b88785e5549703f58326d2ab1b35291d94e21f7cead7a17"
strip_components = 1

[source.linux-x86_64]
url              = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-n9.0.2-39-g7adfbe40dc-linux64-gpl-shared-9.0.tar.xz"
sha256           = "90a42a7d9689c031beacc3d03b139fd8243351d616988e8a74188df949fe5d08"
strip_components = 1

[source.linux-arm64]
url              = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-n9.0.2-39-g7adfbe40dc-linuxarm64-gpl-shared-9.0.tar.xz"
sha256           = "d0a01c8a3c2e31f8613b42c2f7190869e2b87bb3044748702ec4fef71c0bd1b9"
strip_components = 1

# Hashes match ffmpeg.zip.sha256 and ffprobe.zip.sha256 next to each zip.
[[source.macos-arm64]]
url    = "https://ffmpeg.martin-riedl.de/download/macos/arm64/1789931890_9.0.2/ffmpeg.zip"
sha256 = "c8ed4c4e6978a03c485edbfe4e0a5dc2380f8a30bba5150531b31b094492d924"

[[source.macos-arm64]]
url    = "https://ffmpeg.martin-riedl.de/download/macos/arm64/1789931890_9.0.2/ffprobe.zip"
sha256 = "fcbe839537485eaee7a7a8bc5cbc0f90d53617e80943e8a5b2e31cb851197ea6"

[build]
strategy = "repackage"

[build.windows]
pick = ["bin/ffmpeg.exe", "bin/ffprobe.exe", "bin/*.dll"]

[build.linux]
pick = [
    "bin/ffmpeg",
    "bin/ffprobe",
    "lib/libavcodec.so.63",
    "lib/libavdevice.so.63",
    "lib/libavfilter.so.12",
    "lib/libavformat.so.63",
    "lib/libavutil.so.61",
    "lib/libswresample.so.7",
    "lib/libswscale.so.10",
]

[build.macos]
pick    = ["**/ffmpeg", "**/ffprobe"]
flatten = true
into    = "bin"

[executables]
ffmpeg  = "bin/ffmpeg"
ffprobe = "bin/ffprobe"

[[smoke]]
entrypoint    = "ffmpeg"
args          = ["-hide_banner", "-version"]
expect_output = "--enable-gpl"

[[smoke]]
entrypoint    = "ffprobe"
args          = ["-hide_banner", "-f", "lavfi", "testsrc2=duration=1"]
expect_output = "Input #0, lavfi"

# Encodes: a one-second test pattern or tone through each encoder.
[[smoke]]
entrypoint    = "ffmpeg"
args          = ["-hide_banner", "-f", "lavfi", "-i", "testsrc2=duration=1:size=128x72:rate=10", "-c:v", "libx264", "-f", "null", "-"]
expect_output = "(libx264)"

[[smoke]]
entrypoint    = "ffmpeg"
args          = ["-hide_banner", "-f", "lavfi", "-i", "testsrc2=duration=1:size=128x72:rate=10", "-c:v", "libx265", "-f", "null", "-"]
expect_output = "(libx265)"

[[smoke]]
entrypoint    = "ffmpeg"
args          = ["-hide_banner", "-f", "lavfi", "-i", "testsrc2=duration=1:size=128x72:rate=10", "-c:v", "libsvtav1", "-f", "null", "-"]
expect_output = "(libsvtav1)"

[[smoke]]
entrypoint    = "ffmpeg"
args          = ["-hide_banner", "-f", "lavfi", "-i", "sine=duration=1", "-c:a", "libopus", "-f", "null", "-"]
expect_output = "(libopus)"

# GPU support is listed, not run: CI runners have no GPU.
[[smoke]]
entrypoint    = "ffmpeg"
args          = ["-hide_banner", "-encoders"]
expect_output = "h264_nvenc"
platforms     = ["windows-x86_64", "windows-arm64", "linux-x86_64", "linux-arm64"]

[[smoke]]
entrypoint    = "ffmpeg"
args          = ["-hide_banner", "-encoders"]
expect_output = "h264_vulkan"
platforms     = ["windows-x86_64", "windows-arm64", "linux-x86_64", "linux-arm64"]

[[smoke]]
entrypoint    = "ffmpeg"
args          = ["-hide_banner", "-filters"]
expect_output = "libplacebo"
platforms     = ["windows-x86_64", "windows-arm64", "linux-x86_64", "linux-arm64"]

[[smoke]]
entrypoint    = "ffmpeg"
args          = ["-hide_banner", "-encoders"]
expect_output = "h264_videotoolbox"
platforms     = ["macos-arm64"]