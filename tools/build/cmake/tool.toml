# CMake: the official release binaries, repackaged.
#
# Ships cmake and its data directory share/cmake-<major>.<minor>/ (modules,
# templates). On Windows it also ships cmcldeps.exe, which the Ninja
# generator runs for .rc files with MSVC (Windows-MSVC.cmake sets
# CMAKE_NINJA_CMCLDEPS_RC).
#
# cmake finds its data at <bin>/../share/cmake-<major>.<minor>, so the bin/
# and share/ layout is kept. The macOS archive wraps everything in
# CMake.app/Contents/, which strip_components removes to get the same layout.
# The macOS binary is universal and signed by Kitware; it ships unchanged.
#
# LICENSES/ holds doc/cmake/ from the release archives with '/' turned into
# '-' and LF line endings. The macOS build does not bundle curl, nghttp2 or
# zlib, so three of those files only apply to the other platforms.

schema           = 1
name             = "cmake"
description      = "Cross-platform build system generator."
homepage         = "https://cmake.org/"
version          = "4.4.4"
upstream_version = "v4.4.4"
license          = ["BSD-3-Clause", "Apache-2.0", "curl", "BSD-2-Clause", "0BSD", "MIT", "Zlib"]
platforms        = ["windows-x86_64", "windows-arm64", "linux-x86_64", "linux-arm64", "macos-arm64"]

# Hashes match cmake-4.4.4-SHA-256.txt from the release.
[source.windows-x86_64]
url              = "https://github.com/Kitware/CMake/releases/download/v4.4.4/cmake-4.4.4-windows-x86_64.zip"
sha256           = "bace36e94b31c68ab6fa295f26dfa11219e0701cf7c94b0284a7d1cb13dac536"
strip_components = 1

[source.windows-arm64]
url              = "https://github.com/Kitware/CMake/releases/download/v4.4.4/cmake-4.4.4-windows-arm64.zip"
sha256           = "ed673bbc4eb7c1e59b0407fd52f1680fc0ae3229a46b9b7b3ea9133764f07f67"
strip_components = 1

[source.linux-x86_64]
url              = "https://github.com/Kitware/CMake/releases/download/v4.4.4/cmake-4.4.4-linux-x86_64.tar.gz"
sha256           = "e5bb807f7728cb60cd8b27ebc97a2edb469b68655f21e844a600c3575b76f5bb"
strip_components = 1

[source.linux-arm64]
url              = "https://github.com/Kitware/CMake/releases/download/v4.4.4/cmake-4.4.4-linux-aarch64.tar.gz"
sha256           = "a1b6cc63636a0e55c63257cf3315a8a5f129e42fade25db1afea4ff8ab06f25e"
strip_components = 1

[source.macos-arm64]
url              = "https://github.com/Kitware/CMake/releases/download/v4.4.4/cmake-4.4.4-macos-universal.tar.gz"
sha256           = "4b7b73704b1db9b374e5c9ab8e17ac6148b817b6396ee75cd94a852cbac9d305"
strip_components = 3

[build]
strategy = "repackage"
pick     = ["bin/cmake", "bin/ctest", "bin/cpack", "share/cmake-*/Modules", "share/cmake-*/Templates", "share/cmake-*/Licenses"]

[build.windows]
pick = ["bin/cmake.exe", "bin/ctest.exe", "bin/cpack.exe", "bin/cmcldeps.exe", "share/cmake-*/Modules", "share/cmake-*/Templates", "share/cmake-*/Licenses"]

[executables]
cmake = "bin/cmake"
ctest = "bin/ctest"
cpack = "bin/cpack"

[[smoke]]
entrypoint    = "cmake"
args          = ["--version"]
expect_output = "cmake version 4.4.4"

# Script mode loads modules, so this proves share/ is found next to bin/.
[[smoke]]
entrypoint    = "cmake"
args          = ["-DSTAGE={stage}", "-P", "{smoke}/check.cmake"]
expect_output = "frice-cmake-ok 4.4.4"

[[smoke]]
entrypoint    = "ctest"
args          = ["--version"]
expect_output = "ctest version 4.4.4"

[[smoke]]
entrypoint    = "cpack"
args          = ["--version"]
expect_output = "cpack version 4.4.4"