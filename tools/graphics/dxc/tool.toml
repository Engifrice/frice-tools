# DXC (DirectX Shader Compiler): Microsoft's official release, repackaged.
#
# Windows only, on purpose: DXIL is consumed by Direct3D 12, which only
# exists on Windows, so D3D12 shaders are cooked on Windows hosts. Slang
# produces every other target (SPIR-V, Metal, WGSL) without DXC. Building DXC
# ourselves (an LLVM fork) for other hosts is ruled out.
#
# Ships dxc and dxcompiler (the compiler library; Slang loads it for DXIL
# output, given its folder with -dxc-path or setDownstreamCompilerPath).
# Since 1.8.2505 DXC validates and signs DXIL with its built-in, open-source
# validator and never loads dxil.dll (only when DXC_DXIL_DLL_PATH asks for
# it), so dxil.dll is left out, and with it the release's LICENSE-MS.txt
# (Microsoft's proprietary terms, which cover none of the shipped files).
# Also left out: dxv, the headers, import libraries and the x86 builds.
#
# The release zip stores paths with backslashes (bin\x64\dxc.exe), hence
# backslash_paths.
#
# LICENSES/: the release's README maps its licenses to files: LICENSE-MIT.txt
# covers d3d12shader.h (not shipped), LICENSE-LLVM.txt "all other files". So:
# LICENSE-LLVM.txt (NCSA) from the release zip, ThirdPartyNotices.txt from the
# tag, and the licenses of the submodules built into dxcompiler (SPIRV-Tools,
# SPIRV-Headers, DirectX-Headers) at the commits the tag pins. LF line endings.

schema           = 1
name             = "dxc"
description      = "DirectX Shader Compiler: HLSL to DXIL (validated and signed) and SPIR-V."
homepage         = "https://github.com/microsoft/DirectXShaderCompiler"
version          = "1.9.2609"
upstream_version = "v1.9.2609"
license          = ["NCSA", "MIT", "Apache-2.0", "BSD-3-Clause"]
platforms        = ["windows-x86_64", "windows-arm64"]

[source]
url             = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip"
sha256          = "ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1"
backslash_paths = true

[build]
strategy = "repackage"
flatten  = true
into     = "bin"

[build.windows-x86_64]
pick = ["bin/x64/dxc.exe", "bin/x64/dxcompiler.dll"]

[build.windows-arm64]
pick = ["bin/arm64/dxc.exe", "bin/arm64/dxcompiler.dll"]

[executables]
dxc = "bin/dxc"

[libraries]
compiler = "bin/dxcompiler"

[[smoke]]
entrypoint    = "dxc"
args          = ["--version"]
expect_output = "1.9.2609"

# DXIL, printed as disassembly. DXC fails if its validator rejects the output.
[[smoke]]
entrypoint    = "dxc"
args          = ["-T", "cs_6_0", "-E", "main", "{smoke}/compute.hlsl"]
expect_output = "dx.op."

[[smoke]]
entrypoint = "dxc"
args       = ["-T", "cs_6_0", "-E", "main", "-Fo", "{tmp}/compute.dxil", "{smoke}/compute.hlsl"]

[[smoke]]
entrypoint    = "dxc"
args          = ["-T", "cs_6_0", "-E", "main", "-spirv", "{smoke}/compute.hlsl"]
expect_output = "OpEntryPoint GLCompute"
