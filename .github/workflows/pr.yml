# Checks every pull request and every push to main, and builds main from
# scratch once a week.
#
#   lint   the linter, a check against the previous release when toolset.toml
#          holds a version not released yet, then the build matrix from
#          platforms.toml (the script tests run locally only:
#          python -m unittest discover -s tests)
#   build  build.yml: build, assemble and smoke-test every platform
#
# Tools built from source are cached in .cache/stages/ (scripts/stagecache.py
# decides per tool whether an entry still matches). Pull requests and pushes
# use the cache; the weekly run builds from scratch and neither restores nor
# saves it, so a break caused by a runner image update shows up within a
# week, not at release time. Pull requests can read caches saved by main, not
# each other's, so main's pushes keep the cache warm.
#
# Actions are pinned to full commit SHAs; the comment names the release.

name: pr

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"  # Mondays, 04:23 UTC

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Lint repository
        run: python scripts/tools.py lint

      # When this change carries a new toolset version, check it now against
      # the latest release (removed tools and keys must be acknowledged), so a
      # mistake shows up in the pull request rather than in the release.
      - name: Check against the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python scripts/tools.py version)
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$version is already released; nothing to check."
            exit 0
          fi
          latest=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // ""')
          if [ -z "$latest" ]; then
            python scripts/tools.py release-check
          else
            gh release download "$latest" --repo "$GITHUB_REPOSITORY" --pattern 'frice-tools-*-release.json' --dir previous
            python scripts/tools.py release-check --previous previous/*-release.json
          fi

      - name: Compute build matrix
        id: matrix
        run: echo "matrix=$(python scripts/tools.py matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: lint
    uses: ./.github/workflows/build.yml
    with:
      matrix: ${{ needs.lint.outputs.matrix }}
      cache: ${{ github.event_name != 'schedule' }}
